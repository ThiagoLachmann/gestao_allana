/* ============ error boundary (keeps the whole app from going blank on a crash) ============ */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError: false, message: "" }; }
  static getDerivedStateFromError(error){ return { hasError: true, message: String((error && error.message) || error) }; }
  componentDidCatch(error, info){ if (window.console) console.error(error, info); }
  render(){
    if (this.state.hasError) {
      return (
        <div style={{background:"#0E1024",color:"#F1EFFB",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center",gap:12}}>
          <div style={{fontSize:16,fontWeight:600}}>Ops, algo travou aqui.</div>
          <div style={{fontSize:12,color:"#9AA0C7",maxWidth:280}}>Seus dados continuam salvos no aparelho. Toque no botão abaixo para recarregar o app.</div>
          {this.state.message && <div style={{fontSize:11,color:"#F27FA6",maxWidth:300,background:"#171A36",border:"1px solid #33386B",borderRadius:10,padding:10,wordBreak:"break-word"}}>{this.state.message}</div>}
          <button onClick={()=>window.location.reload()} style={{background:"#F2C572",color:"#0E1024",border:"none",borderRadius:10,padding:"10px 18px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============ crypto helpers ============ */
const CRYPTO_OK = !!(window.crypto && window.crypto.subtle);
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }
async function deriveKey(password, saltB64) {
  const salt = saltB64 ? b64ToBuf(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
  return { key, saltB64: bufToB64(salt) };
}
async function encryptObj(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: bufToB64(iv), data: bufToB64(cipher) };
}
async function decryptObj(key, payload) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBuf(payload.iv) }, key, b64ToBuf(payload.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function xorObfuscate(str, pass) {
  let out = "";
  for (let i = 0; i < str.length; i++) out += String.fromCharCode(str.charCodeAt(i) ^ pass.charCodeAt(i % pass.length));
  return btoa(unescape(encodeURIComponent(out)));
}
function xorDeobfuscate(b64, pass) {
  const str = decodeURIComponent(escape(atob(b64)));
  let out = "";
  for (let i = 0; i < str.length; i++) out += String.fromCharCode(str.charCodeAt(i) ^ pass.charCodeAt(i % pass.length));
  return out;
}

const WD_FULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
function normDias(str){
  if(!str) return [];
  return str.split(",").map(s=>s.trim().toLowerCase()).map(t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"")).map(t=>{
    if(t.startsWith("dom")) return 0; if(t.startsWith("seg")) return 1; if(t.startsWith("ter")) return 2;
    if(t.startsWith("qua")) return 3; if(t.startsWith("qui")) return 4; if(t.startsWith("sex")) return 5;
    if(t.startsWith("sab")) return 6; return null;
  }).filter(v=>v!==null);
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function occursOn(values, date){
  const freq = values.frequencia, dias = normDias(values.diasSemana), wd = date.getDay();
  if(freq==="Diária") return true;
  if(freq==="Pontual") return values.data === isoDate(date);
  if(freq==="Semanal") return dias.includes(wd);
  if(freq==="Quinzenal"){
    if(dias.length && !dias.includes(wd)) return false;
    if(!dias.length && wd!==6) return false;
    const weekNum = Math.floor(date.getTime()/(7*24*3600*1000));
    return weekNum % 2 === 0;
  }
  if(freq==="Mensal"){
    if(dias.length) return dias.includes(wd) && date.getDate()<=7;
    return date.getDate()===1;
  }
  return false;
}
function matchesWeekday(values, wdIndex){
  if(wdIndex===null || wdIndex===undefined) return true;
  const freq = values.frequencia;
  if(freq==="Diária") return true;
  if(freq==="Pontual"){
    if(!values.data) return false;
    const d = new Date(values.data+"T00:00:00");
    return d.getDay()===wdIndex;
  }
  const dias = normDias(values.diasSemana);
  if(dias.length) return dias.includes(wdIndex);
  return wdIndex===6;
}

/* ============ App root with auth gate ============ */
function Root(){
  const [phase, setPhase] = useState("loading");
  const [authInfo, setAuthInfo] = useState(null);
  const [cryptoKey, setCryptoKey] = useState(null);
  const [rawPass, setRawPass] = useState(null);
  const [state, setState] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    const auth = localStorage.getItem(AUTH_KEY);
    if (auth) { setAuthInfo(JSON.parse(auth)); setPhase("login"); }
    else setPhase("setup");
  }, []);

  async function handleSetup(email, password){
    setError("");
    let saltB64 = null, key = null;
    if (CRYPTO_OK) { const d = await deriveKey(password); key = d.key; saltB64 = d.saltB64; }
    localStorage.setItem(AUTH_KEY, JSON.stringify({ email, saltB64, mode: CRYPTO_OK ? "aes" : "xor" }));
    if (CRYPTO_OK) {
      const payload = await encryptObj(key, DEFAULT_STATE);
      localStorage.setItem(VAULT_KEY, JSON.stringify(payload));
      setCryptoKey(key);
    } else {
      localStorage.setItem(VAULT_KEY, xorObfuscate(JSON.stringify(DEFAULT_STATE), password));
      setRawPass(password);
    }
    setState(DEFAULT_STATE);
    setPhase("app");
  }
  async function handleLogin(password){
    setError("");
    try {
      const vaultRaw = localStorage.getItem(VAULT_KEY);
      if (authInfo.mode === "aes" && CRYPTO_OK) {
        const { key } = await deriveKey(password, authInfo.saltB64);
        const data = await decryptObj(key, JSON.parse(vaultRaw));
        setCryptoKey(key); setState(data); setPhase("app");
      } else {
        const json = xorDeobfuscate(vaultRaw, password);
        const data = JSON.parse(json);
        setRawPass(password); setState(data); setPhase("app");
      }
    } catch (e) {
      setError("Senha incorreta.");
    }
  }
  function handleReset(){
    localStorage.removeItem(AUTH_KEY); localStorage.removeItem(VAULT_KEY);
    setAuthInfo(null); setPhase("setup"); setError("");
  }
  function handleLogout(){
    setCryptoKey(null); setRawPass(null); setState(null); setPhase("login"); setError("");
  }
  async function persist(newState){
    setState(newState);
    try {
      if (cryptoKey) {
        const payload = await encryptObj(cryptoKey, newState);
        localStorage.setItem(VAULT_KEY, JSON.stringify(payload));
      } else if (rawPass) {
        localStorage.setItem(VAULT_KEY, xorObfuscate(JSON.stringify(newState), rawPass));
      }
    } catch(e) { /* storage best-effort */ }
  }

  if (phase === "loading") return <Splash text="Carregando…" />;
  if (phase === "setup") return <SetupScreen onSubmit={handleSetup} cryptoOk={CRYPTO_OK} />;
  if (phase === "login") return <LoginScreen email={authInfo && authInfo.email} onSubmit={handleLogin} onReset={handleReset} error={error} />;
  return <App state={state} persist={persist} onLogout={handleLogout} />;
}

function Splash({ text }){
  return <div style={{background:INK,color:MUTED,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{text}</div>;
}

function SetupScreen({ onSubmit, cryptoOk }){
  const [email, setEmail] = useState(""); const [p1, setP1] = useState(""); const [p2, setP2] = useState(""); const [err, setErr] = useState("");
  function submit(){
    if (!p1 || p1.length < 4) return setErr("Escolha uma senha com pelo menos 4 caracteres.");
    if (p1 !== p2) return setErr("As senhas não coincidem.");
    onSubmit(email, p1);
  }
  return (
    <div style={{background:INK,color:TEXT,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:PANEL,borderColor:HAIRLINE,maxWidth:340,width:"100%",border:"1px solid",borderRadius:16,padding:20}} className="fade-in">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><Icon name="lock" size={18} color={GOLD}/><span style={{fontFamily:"Georgia,serif",fontSize:20}}>Proteger meu app</span></div>
        <p style={{color:MUTED,fontSize:12,marginTop:4,marginBottom:14}}>Crie um e-mail (só identificação) e uma senha pra evitar que outras pessoas abram sua rotina.</p>
        <Field label="E-mail"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={inputStyle} placeholder="voce@email.com"/></Field>
        <Field label="Senha"><input type="password" value={p1} onChange={e=>setP1(e.target.value)} style={inputStyle}/></Field>
        <Field label="Confirmar senha"><input type="password" value={p2} onChange={e=>setP2(e.target.value)} style={inputStyle}/></Field>
        {!cryptoOk && <div style={{color:"#F2C572",fontSize:11,marginBottom:8}}>Este navegador não permite criptografia forte neste modo de abertura — a senha ainda funciona como tranca, mas para proteção completa, hospede este arquivo num link https.</div>}
        {err && <div style={{color:"#F27FA6",fontSize:12,marginBottom:8}}>{err}</div>}
        <button onClick={submit} style={{...btnGold, width:"100%"}}>Criar e continuar</button>
      </div>
    </div>
  );
}
function LoginScreen({ email, onSubmit, onReset, error }){
  const [p, setP] = useState(""); const [confirmReset, setConfirmReset] = useState(false);
  return (
    <div style={{background:INK,color:TEXT,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:PANEL,borderColor:HAIRLINE,maxWidth:340,width:"100%",border:"1px solid",borderRadius:16,padding:20}} className="fade-in">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><Icon name="lock" size={18} color={GOLD}/><span style={{fontFamily:"Georgia,serif",fontSize:20}}>Minha Rotina</span></div>
        {email && <p style={{color:MUTED,fontSize:12,marginTop:2,marginBottom:14}}>Acesso de {email}</p>}
        <Field label="Senha"><input autoFocus type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&onSubmit(p)} style={inputStyle}/></Field>
        {error && <div style={{color:"#F27FA6",fontSize:12,marginBottom:8}}>{error}</div>}
        <button onClick={()=>onSubmit(p)} style={{...btnGold, width:"100%"}}>Entrar</button>
        <button onClick={()=>setConfirmReset(v=>!v)} style={{background:"transparent",color:MUTED,fontSize:11,marginTop:10,width:"100%",border:"none"}}>Esqueci minha senha</button>
        {confirmReset && (
          <div style={{fontSize:11,color:MUTED,marginTop:6}}>
            Não é possível recuperar a senha (não há servidor). Você pode apagar os dados salvos neste aparelho e começar de novo — se você sincroniza com o Google Sheets, seus dados reais continuam lá.
            <button onClick={onReset} style={{...btnDanger, width:"100%", marginTop:8}}>Apagar dados locais e recomeçar</button>
          </div>
        )}
      </div>
    </div>
  );
}
function Field({ label, children }){
  return <div style={{marginBottom:10}}><label style={{fontSize:11,color:MUTED}}>{label}</label><div style={{marginTop:4}}>{children}</div></div>;
}
const inputStyle = { width:"100%", background:PANEL2, border:`1px solid ${HAIRLINE}`, color:TEXT, borderRadius:10, padding:"8px 10px", fontSize:14 };
const btnGold = { background:GOLD, color:INK, border:"none", borderRadius:10, padding:"10px 14px", fontSize:14, fontWeight:600, cursor:"pointer" };
const btnDanger = { background:"transparent", color:"#F27FA6", border:"1px solid #F27FA6", borderRadius:10, padding:"8px 12px", fontSize:12, cursor:"pointer" };

/* ============ main app ============ */
function App({ state, persist, onLogout }){
  const [tab, setTab] = useState("hoje");
  const { categories, fields, activities, connections, statusMap, settings } = state;

  function update(patch){ persist({ ...state, ...patch }); }
  function setCategories(fn){ update({ categories: fn(categories) }); }
  function setFields(fn){ update({ fields: fn(fields) }); }
  function setActivities(fn){ update({ activities: fn(activities) }); }
  function setConnections(fn){ update({ connections: fn(connections) }); }
  function setStatusMap(fn){ update({ statusMap: fn(statusMap) }); }
  function setSettings(fn){ update({ settings: fn(settings) }); }

  const [syncState, setSyncState] = useState("idle");
  async function testConnection(){
    if(!settings.appsScriptUrl) return;
    setSyncState("testing");
    try { await sheetGet(settings.appsScriptUrl, "atividades"); setSyncState("ok"); }
    catch(e){ setSyncState("error"); }
  }
  async function importFromSheet(){
    if(!settings.appsScriptUrl) return;
    setSyncState("testing");
    try {
      const rows = await sheetGet(settings.appsScriptUrl, "atividades");
      const imported = rows.map(r => ({ id: r.ID, ativo: r.Ativo !== false && r.Ativo !== "FALSE",
        values: { categoria:r.Categoria, atividade:r.Atividade, frequencia:r.Frequencia, diasSemana:r.DiasSemana, horario:r.Horario, duracao:r.Duracao, prioridade:r.Prioridade, lembrete:r.Lembrete, data:r.Data, observacoes:r.Observacoes }}));
      if (imported.length) setActivities(() => imported);
      setSyncState("ok");
    } catch(e){ setSyncState("error"); }
  }
  function syncAdd(values){ if(settings.appsScriptUrl) sheetPost(settings.appsScriptUrl, { action:"novaAtividade", atividade: toSheetPayload(values) }).catch(()=>{}); }
  function syncEdit(id, values){ if(settings.appsScriptUrl) sheetPost(settings.appsScriptUrl, { action:"editarAtividade", atividade: { id, ...toSheetPayload(values), ativo:true } }).catch(()=>{}); }
  function syncDelete(id){ if(settings.appsScriptUrl) sheetPost(settings.appsScriptUrl, { action:"excluirAtividade", id }).catch(()=>{}); }
  function syncStatus(activityId, date, status){ if(settings.appsScriptUrl) sheetPost(settings.appsScriptUrl, { action:"marcar", idAtividade: activityId, data: date, status }).catch(()=>{}); }

  const activeActivities = useMemo(()=>activities.filter(a=>a.ativo!==false), [activities]);
  const today = new Date(); const todayIso = isoDate(today); const todayWdLabel = WD[today.getDay()];
  const todayActivities = useMemo(()=>activeActivities.filter(a=>occursOn(a.values, today)), [activeActivities]);

  function getStatus(activityId, date){ return statusMap[`${activityId}_${date}`] || "aguardando"; }
  function setStatus(activityId, date, status){ setStatusMap(prev=>({ ...prev, [`${activityId}_${date}`]: status })); syncStatus(activityId, date, status); }

  return (
    <div style={{background:INK,color:TEXT,minHeight:"100vh"}} className="fade-in">
      <div style={{maxWidth:420,margin:"0 auto",display:"flex",flexDirection:"column",minHeight:"100vh"}}>
        <div style={{borderColor:HAIRLINE,borderBottom:"1px solid"}}>
          <Header tab={tab} today={today} todayWdLabel={todayWdLabel} settings={settings} syncState={syncState} onLogout={onLogout} />
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"16px"}}>
          {tab==="hoje" && <Hoje todayActivities={todayActivities} fields={fields} categories={categories} todayIso={todayIso} getStatus={getStatus} setStatus={setStatus} />}
          {tab==="calendario" && <CalendarTab activities={activeActivities} categories={categories} fields={fields} getStatus={getStatus} setStatus={setStatus} />}
          {tab==="kanban" && <Kanban activities={activeActivities} categories={categories} getStatus={getStatus} setStatus={setStatus} />}
          {tab==="atividades" && <Atividades activities={activities} setActivities={setActivities} fields={fields} categories={categories} getStatus={getStatus} setStatus={setStatus} todayIso={todayIso} onAdd={syncAdd} onEdit={syncEdit} onDelete={syncDelete} />}
          {tab==="ajustes" && <Ajustes fields={fields} setFields={setFields} categories={categories} setCategories={setCategories} settings={settings} setSettings={setSettings} syncState={syncState} testConnection={testConnection} importFromSheet={importFromSheet} />}
        </div>
        <nav style={{borderColor:HAIRLINE,borderTop:"1px solid",background:PANEL,display:"flex",justifyContent:"space-around",padding:"6px 0"}}>
          <TabBtn icon="home" label="Hoje" active={tab==="hoje"} onClick={()=>setTab("hoje")} />
          <TabBtn icon="calendar" label="Calendário" active={tab==="calendario"} onClick={()=>setTab("calendario")} />
          <TabBtn icon="grid" label="Kanban" active={tab==="kanban"} onClick={()=>setTab("kanban")} />
          <TabBtn icon="list" label="Atividades" active={tab==="atividades"} onClick={()=>setTab("atividades")} />
          <TabBtn icon="gear" label="Ajustes" active={tab==="ajustes"} onClick={()=>setTab("ajustes")} />
        </nav>
      </div>
    </div>
  );
}

function Header({ tab, today, todayWdLabel, settings, syncState, onLogout }){
  const titles = { hoje:"Hoje", calendario:"Calendário", kanban:"Kanban", atividades:"Atividades", ajustes:"Ajustes" };
  const dateStr = today.toLocaleDateString("pt-BR",{day:"2-digit",month:"long"});
  return (
    <div style={{padding:"20px 16px 16px",display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
      <div>
        <div style={{color:MUTED,fontSize:11,textTransform:"uppercase",letterSpacing:1}}>{todayWdLabel} · {dateStr}</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:22,marginTop:2}}>{titles[tab]}</div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginTop:8}}>
        <Icon name={settings.appsScriptUrl && syncState==="ok" ? "cloud" : "cloudoff"} size={16} color={settings.appsScriptUrl && syncState==="ok" ? "#6FD9A0" : MUTED} />
        <button onClick={onLogout} title="Sair" style={{background:"transparent",border:"none",color:MUTED,cursor:"pointer"}}><Icon name="logout" size={16}/></button>
      </div>
    </div>
  );
}
function TabBtn({ icon, label, active, onClick }){
  return (
    <button onClick={onClick} style={{background:"transparent",border:"none",cursor:"pointer",color:active?GOLD:MUTED,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 6px"}}>
      <Icon name={icon} size={19} color={active?GOLD:MUTED} />
      <span style={{fontSize:9}}>{label}</span>
    </button>
  );
}
function FieldValue({ field, value }){
  if(!value) return null;
  return <div style={{fontSize:11,color:MUTED}}><span style={{color:TEXT}}>{field.label}:</span> {value}</div>;
}
function QuickCheck({ done, onToggle }){
  return (
    <button onClick={onToggle} style={{ width:22, height:22, borderRadius:6, border:`1.5px solid ${done?GOLD:HAIRLINE}`, background: done? GOLD : "transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0 }}>
      {done && <Icon name="check" size={13} color={INK} />}
    </button>
  );
}
function WeekdayFilter({ value, onChange }){
  return (
    <select value={value===null?"":value} onChange={e=>onChange(e.target.value===""?null:Number(e.target.value))} style={{...inputStyle,fontSize:12,padding:"6px 8px"}}>
      <option value="">Todos os dias</option>
      {WD_FULL.map((w,i)=><option key={i} value={i}>{w}</option>)}
    </select>
  );
}

/* ---------- HOJE ---------- */
function Hoje({ todayActivities, fields, categories, todayIso, getStatus, setStatus }){
  const done = todayActivities.filter(a=>getStatus(a.id, todayIso)==="finalizado").length;
  const total = todayActivities.length;
  const visibleFields = fields.filter(f=>f.show.today && f.id!=="categoria" && f.id!=="atividade");
  if(total===0) return <EmptyState text="Nenhuma atividade prevista para hoje. Aproveite para respirar ou adiantar algo da semana." />;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:16,padding:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:13,color:MUTED}}>Progresso de hoje</span>
        <span style={{fontSize:13,fontWeight:600,color:GOLD}}>{done}/{total}</span>
      </div>
      {todayActivities.map(a=>{
        const isDone = getStatus(a.id, todayIso)==="finalizado";
        const color = catColor(categories, a.values.categoria);
        return (
          <div key={a.id} style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:16,padding:12,opacity:isDone?0.55:1,display:"flex",gap:12,alignItems:"flex-start"}}>
            <QuickCheck done={isDone} onToggle={()=>setStatus(a.id, todayIso, isDone?"aguardando":"finalizado")} />
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{background:color,width:8,height:8,borderRadius:99,flexShrink:0}} />
                <span style={{fontSize:14,fontWeight:500,textDecoration:isDone?"line-through":"none"}}>{a.values.atividade}</span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:"2px 12px",marginTop:4}}>
                {visibleFields.map(f=><FieldValue key={f.id} field={f} value={a.values[f.id]} />)}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}
function EmptyState({ text }){ return <div style={{color:MUTED,fontSize:13,textAlign:"center",padding:"60px 20px"}}>{text}</div>; }

/* ---------- CALENDÁRIO ---------- */
function CalendarTab({ activities, categories, fields, getStatus, setStatus }){
  const [monthDate, setMonthDate] = useState(new Date());
  const [selected, setSelected] = useState(isoDate(new Date()));

  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));

  const todayIso = isoDate(new Date());
  const selectedDateObj = new Date(selected+"T00:00:00");
  const dayActivities = activities.filter(a=>occursOn(a.values, selectedDateObj));

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:16,padding:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <button onClick={()=>setMonthDate(new Date(year, month-1, 1))} style={{background:"transparent",border:"none",cursor:"pointer"}}><Icon name="chevronleft" size={18} color={MUTED}/></button>
          <span style={{fontSize:14,fontWeight:500,textTransform:"capitalize"}}>{monthDate.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</span>
          <button onClick={()=>setMonthDate(new Date(year, month+1, 1))} style={{background:"transparent",border:"none",cursor:"pointer"}}><Icon name="chevronright" size={18} color={MUTED}/></button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
          {WD.map(w=><div key={w} style={{textAlign:"center",fontSize:10,color:MUTED}}>{w}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={i} />;
            const iso = isoDate(d);
            const count = activities.filter(a=>occursOn(a.values, d)).length;
            const isSelected = iso===selected;
            const isToday = iso===todayIso;
            return (
              <button key={i} onClick={()=>setSelected(iso)}
                style={{
                  aspectRatio:"1", borderRadius:8, border: isToday?`1px solid ${GOLD}`:"1px solid transparent",
                  background: isSelected ? GOLD : PANEL2, color: isSelected ? INK : TEXT,
                  fontSize:12, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2, padding:0
                }}>
                {d.getDate()}
                {count>0 && <span style={{width:4,height:4,borderRadius:99,background:isSelected?INK:GOLD}} />}
              </button>
            );
          })}
        </div>
      </div>

      <div>
        <div style={{fontSize:12,color:MUTED,marginBottom:8}}>
          {selectedDateObj.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})} · {dayActivities.length} atividade(s)
        </div>
        {dayActivities.length===0 && <EmptyState text="Nada previsto para esse dia." />}
        {dayActivities.map(a=>{
          const isDone = getStatus(a.id, selected)==="finalizado";
          const color = catColor(categories, a.values.categoria);
          return (
            <div key={a.id} style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:14,padding:12,marginBottom:8,display:"flex",gap:10,alignItems:"flex-start",opacity:isDone?0.55:1}}>
              <QuickCheck done={isDone} onToggle={()=>setStatus(a.id, selected, isDone?"aguardando":"finalizado")} />
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{background:color,width:8,height:8,borderRadius:99,flexShrink:0}} />
                  <span style={{fontSize:13,fontWeight:500,textDecoration:isDone?"line-through":"none"}}>{a.values.atividade}</span>
                </div>
                <div style={{fontSize:11,color:MUTED,marginTop:2}}>{a.values.horario}{a.values.duracao?" · "+a.values.duracao:""}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- KANBAN ---------- */
function Kanban({ activities, categories, getStatus, setStatus }){
  const [dragId, setDragId] = useState(null);
  const [rangeDays, setRangeDays] = useState(14);
  const [weekdayFilter, setWeekdayFilter] = useState(null);
  const cards = useMemo(()=>{
    const out = []; const start = new Date();
    for(let i=0;i<rangeDays;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      if(weekdayFilter!==null && d.getDay()!==weekdayFilter) continue;
      activities.forEach(a=>{ if(occursOn(a.values, d)) out.push({ activity:a, date: isoDate(d) }); });
    }
    return out;
  }, [activities, rangeDays, weekdayFilter]);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:8}}>
        <WeekdayFilter value={weekdayFilter} onChange={setWeekdayFilter} />
        <button onClick={()=>setRangeDays(r=>r+14)} style={{...btnGold, padding:"6px 10px", fontSize:12, display:"flex", alignItems:"center", gap:6, whiteSpace:"nowrap"}}>
          <Icon name="calendar" size={13} color={INK}/> +14 dias
        </button>
      </div>
      <div style={{fontSize:11,color:MUTED,marginBottom:8}}>Mostrando {rangeDays} dias à frente{weekdayFilter!==null?` · só ${WD_FULL[weekdayFilter]}`:""}</div>
      <div style={{display:"flex",gap:12,overflowX:"auto",paddingBottom:8,marginLeft:-16,marginRight:-16,paddingLeft:16,paddingRight:16}}>
        {STATUS_LIST.map(status=>{
          const col = cards.filter(c=>getStatus(c.activity.id,c.date)===status.id);
          return (
            <div key={status.id}
              onDragOver={e=>e.preventDefault()}
              onDrop={()=>{ if(dragId){ setStatus(dragId.activityId, dragId.date, status.id); setDragId(null); } }}
              style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:16,minWidth:190,flexShrink:0,padding:8}}>
              <div style={{fontSize:11,fontWeight:600,color:MUTED,padding:"4px 4px",display:"flex",justifyContent:"space-between"}}>
                {status.label} <span>{col.length}</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:4}}>
                {col.map(c=>{
                  const color = catColor(categories, c.activity.values.categoria);
                  const isDone = status.id === "finalizado";
                  return (
                    <div key={c.activity.id+c.date} draggable onDragStart={()=>setDragId({activityId:c.activity.id,date:c.date})}
                      style={{background:PANEL2,borderLeft:`3px solid ${color}`,borderRadius:10,padding:8,fontSize:12,cursor:"grab"}}>
                      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
                        <div style={{fontWeight:500}}>{c.activity.values.atividade}</div>
                        <QuickCheck done={isDone} onToggle={()=>setStatus(c.activity.id, c.date, isDone?"aguardando":"finalizado")} />
                      </div>
                      <div style={{color:MUTED,marginTop:4}}>{new Date(c.date+"T00:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</div>
                    </div>
                  );
                })}
                {col.length===0 && <div style={{fontSize:11,color:MUTED,padding:"8px 4px"}}>Sem cards</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- ATIVIDADES ---------- */
function Atividades({ activities, setActivities, fields, categories, getStatus, setStatus, todayIso, onAdd, onEdit, onDelete }){
  const [editing, setEditing] = useState(null);
  const [weekdayFilter, setWeekdayFilter] = useState(null);
  const formFields = fields.filter(f=>f.show.form);
  const filtered = activities.filter(a=>matchesWeekday(a.values, weekdayFilter));

  function save(values){
    if(editing==="new"){
      const id = `a${Date.now()}`;
      setActivities(prev=>[...prev, {id, ativo:true, values}]);
      onAdd(values);
    } else {
      setActivities(prev=>prev.map(a=>a.id===editing.id ? {...a, values} : a));
      onEdit(editing.id, values);
    }
    setEditing(null);
  }
  function remove(id){ setActivities(prev=>prev.filter(a=>a.id!==id)); onDelete(id); }

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <button onClick={()=>setEditing("new")} style={{background:GOLD,borderColor:GOLD,border:"1px solid",color:INK,borderRadius:12,padding:11,cursor:"pointer",fontWeight:600}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:14}}><Icon name="plus" size={16} color={INK}/> Nova atividade (recorrente ou pontual)</div>
      </button>
      <WeekdayFilter value={weekdayFilter} onChange={setWeekdayFilter} />
      {filtered.length===0 && <EmptyState text="Nenhuma atividade encontrada com esse filtro." />}
      {filtered.map(a=>{
        const isDone = getStatus(a.id, todayIso)==="finalizado";
        return (
          <div key={a.id} style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:12,padding:12,opacity:a.ativo===false?0.5:1,display:"flex",alignItems:"center",gap:8}}>
            <QuickCheck done={isDone} onToggle={()=>setStatus(a.id, todayIso, isDone?"aguardando":"finalizado")} />
            <div style={{minWidth:0,flex:1,cursor:"pointer"}} onClick={()=>setEditing(a)}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{background:catColor(categories,a.values.categoria),width:8,height:8,borderRadius:99,flexShrink:0}} />
                <span style={{fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.values.atividade}</span>
              </div>
              <div style={{fontSize:11,color:MUTED,marginTop:2}}>{a.values.frequencia}{a.values.diasSemana?" · "+a.values.diasSemana:""}</div>
            </div>
            <button onClick={()=>remove(a.id)} style={{background:"transparent",border:"none",cursor:"pointer"}}><Icon name="trash" size={15} color={MUTED}/></button>
          </div>
        );
      })}
      {editing && (
        <EditModal
          initial={editing==="new" ? Object.fromEntries(formFields.map(f=>[f.id,""])) : editing.values}
          fields={formFields} categories={categories} onCancel={()=>setEditing(null)} onSave={save}
        />
      )}
    </div>
  );
}
function EditModal({ initial, fields, categories, onCancel, onSave }){
  const [values, setValues] = useState(initial);
  return (
    <div style={{background:"rgba(0,0,0,0.6)",position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:12}}>
      <div style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",maxWidth:360,width:"100%",maxHeight:"85vh",overflowY:"auto",borderRadius:16,padding:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:14,fontWeight:600}}>Editar atividade</div>
          <button onClick={onCancel} style={{background:"transparent",border:"none",cursor:"pointer"}}><Icon name="x" size={16} color={MUTED}/></button>
        </div>
        <div style={{fontSize:11,color:MUTED,marginBottom:10}}>Dica: em "Frequência" escolha Diária/Semanal/Quinzenal/Mensal para atividades que se repetem, e preencha "Dias da Semana" (ex: Segunda, Quarta). Escolha Pontual só para algo único, com data marcada.</div>
        {fields.map(f=>(
          <Field key={f.id} label={f.label}>
            {f.id==="categoria" ? (
              <select value={values[f.id]||""} onChange={e=>setValues(v=>({...v,[f.id]:e.target.value}))} style={inputStyle}>
                {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            ) : f.type==="select" ? (
              <select value={values[f.id]||""} onChange={e=>setValues(v=>({...v,[f.id]:e.target.value}))} style={inputStyle}>
                <option value="">-</option>{(f.options||[]).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            ) : f.type==="textarea" ? (
              <textarea value={values[f.id]||""} onChange={e=>setValues(v=>({...v,[f.id]:e.target.value}))} style={{...inputStyle,minHeight:60}} />
            ) : (
              <input type={f.type==="date"?"date":"text"} value={values[f.id]||""} onChange={e=>setValues(v=>({...v,[f.id]:e.target.value}))} style={inputStyle} />
            )}
          </Field>
        ))}
        <button onClick={()=>onSave(values)} style={{...btnGold,width:"100%",marginTop:6}}>Salvar</button>
      </div>
    </div>
  );
}

/* ---------- AJUSTES ---------- */
function Ajustes({ fields, setFields, categories, setCategories, settings, setSettings, syncState, testConnection, importFromSheet }){
  const [openFields, setOpenFields] = useState(true);
  const [openCats, setOpenCats] = useState(false);
  function updateField(id, patch){ setFields(prev=>prev.map(f=>f.id===id?{...f,...patch}:f)); }
  function updateShow(id, key, val){ setFields(prev=>prev.map(f=>f.id===id?{...f,show:{...f.show,[key]:val}}:f)); }
  function addField(){ const id=`campo${Date.now()}`; setFields(prev=>[...prev,{id,label:"Novo campo",type:"text",show:{today:false,kanban:false,mindmap:false,table:true,form:true}}]); }
  function removeField(id){ setFields(prev=>prev.filter(f=>f.id!==id)); }
  function updateCategory(id, patch){ setCategories(prev=>prev.map(c=>c.id===id?{...c,...patch}:c)); }
  function addCategory(){ setCategories(prev=>[...prev,{id:`cat${Date.now()}`,name:"Nova categoria",color:"#9AA5C9"}]); }
  function removeCategory(id){ setCategories(prev=>prev.filter(c=>c.id!==id)); }

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:16,padding:12}}>
        <div style={{fontSize:12,color:MUTED,display:"flex",alignItems:"center",gap:6,marginBottom:8}}><Icon name="link" size={13}/> Conexão com Google Sheets</div>
        <input value={settings.appsScriptUrl} onChange={e=>setSettings(s=>({...s,appsScriptUrl:e.target.value}))} placeholder="Cole aqui a URL do Apps Script (…/exec)" style={{...inputStyle,marginBottom:8,fontSize:12}} />
        <div style={{display:"flex",gap:8}}>
          <button onClick={testConnection} style={{...btnGold,flex:1,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><Icon name="refresh" size={12} color={INK}/> Testar</button>
          <button onClick={importFromSheet} style={{background:PANEL2,color:TEXT,border:`1px solid ${HAIRLINE}`,borderRadius:10,flex:1,fontSize:12,cursor:"pointer"}}>Importar da planilha</button>
        </div>
        {syncState==="ok" && <div style={{fontSize:11,color:"#6FD9A0",marginTop:6}}>Conectado com sucesso.</div>}
        {syncState==="error" && <div style={{fontSize:11,color:"#F27FA6",marginTop:6}}>Não consegui conectar. Confira a implantação (acesso "Qualquer pessoa") e tente de novo.</div>}
      </div>

      <Section title="Campos personalizados" icon="list" open={openFields} onToggle={()=>setOpenFields(o=>!o)}>
        {fields.map(f=>(
          <div key={f.id} style={{background:PANEL2,borderColor:HAIRLINE,border:"1px solid",borderRadius:12,padding:10}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <input value={f.label} onChange={e=>updateField(f.id,{label:e.target.value})} style={{flex:1,background:"transparent",border:"none",color:TEXT,fontSize:13}} />
              <select value={f.type} onChange={e=>updateField(f.id,{type:e.target.value})} style={{...inputStyle,width:"auto",fontSize:11,padding:"4px 6px"}}>
                <option value="text">Texto</option><option value="textarea">Texto longo</option><option value="select">Lista</option><option value="date">Data</option>
              </select>
              <button onClick={()=>removeField(f.id)} style={{background:"transparent",border:"none",cursor:"pointer"}}><Icon name="trash" size={13} color={MUTED}/></button>
            </div>
            {f.type==="select" && f.id!=="categoria" && (
              <input value={(f.options||[]).join(", ")} onChange={e=>updateField(f.id,{options:e.target.value.split(",").map(s=>s.trim()).filter(Boolean)})} placeholder="Opções separadas por vírgula" style={{...inputStyle,fontSize:11,marginBottom:6}} />
            )}
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {["today","kanban","mindmap","table","form"].map(k=>(
                <label key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:MUTED}}>
                  <input type="checkbox" checked={!!f.show[k]} onChange={e=>updateShow(f.id,k,e.target.checked)} />
                  {({today:"Hoje",kanban:"Kanban",mindmap:"Mapa",table:"Tabela",form:"Formulário"})[k]}
                </label>
              ))}
            </div>
          </div>
        ))}
        <button onClick={addField} style={{border:`1px dashed ${HAIRLINE}`,color:MUTED,background:"transparent",borderRadius:10,padding:8,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",cursor:"pointer"}}><Icon name="plus" size={13}/> Adicionar campo</button>
      </Section>

      <Section title="Categorias" icon="palette" open={openCats} onToggle={()=>setOpenCats(o=>!o)}>
        {categories.map(c=>(
          <div key={c.id} style={{background:PANEL2,borderColor:HAIRLINE,border:"1px solid",borderRadius:12,padding:8,display:"flex",alignItems:"center",gap:8}}>
            <input type="color" value={c.color} onChange={e=>updateCategory(c.id,{color:e.target.value})} style={{width:26,height:26,borderRadius:6}} />
            <input value={c.name} onChange={e=>updateCategory(c.id,{name:e.target.value})} style={{flex:1,background:"transparent",border:"none",color:TEXT,fontSize:13}} />
            <button onClick={()=>removeCategory(c.id)} style={{background:"transparent",border:"none",cursor:"pointer"}}><Icon name="trash" size={13} color={MUTED}/></button>
          </div>
        ))}
        <button onClick={addCategory} style={{border:`1px dashed ${HAIRLINE}`,color:MUTED,background:"transparent",borderRadius:10,padding:8,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",cursor:"pointer"}}><Icon name="plus" size={13}/> Adicionar categoria</button>
      </Section>

      <div style={{fontSize:10,color:HAIRLINE,textAlign:"center",padding:"4px 0 12px"}}>{APP_VERSION}</div>
    </div>
  );
}
function Section({ title, icon, open, onToggle, children }){
  return (
    <div style={{background:PANEL,borderColor:HAIRLINE,border:"1px solid",borderRadius:16,padding:12}}>
      <button onClick={onToggle} style={{background:"transparent",border:"none",cursor:"pointer",width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:12,color:MUTED,display:"flex",alignItems:"center",gap:6}}><Icon name={icon} size={13}/> {title}</span>
        <Icon name={open?"chevronup":"chevrondown"} size={14} color={MUTED} />
      </button>
      {open && <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>{children}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><Root /></ErrorBoundary>);
</script>
<script>
  (function () {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var script = document.createElement("script");
    script.textContent = out;
    document.body.appendChild(script);
  })();
</script>
</body>
